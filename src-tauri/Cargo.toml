[package]
name = "anchor"
version = "0.1.0"
description = "Anchor — live notes overlay. Prepared, not prompted."
edition = "2021"
license = "AGPL-3.0-only"
repository = ""
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sqlite-vec = "0.1.9"
fastembed = "5"
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
